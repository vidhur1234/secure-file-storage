spring.application.name=secure-file-storage

# Server Port - Binds to platform PORT env var (Render, Railway, Heroku, Cloud Run)
server.port=${PORT:8080}

# Production / MySQL DataSource with Environment Variable Overrides
# Defaults to localhost MySQL if environment variables are not set
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/secure_storage_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Storage Configuration (Local simulated cloud storage directory)
app.storage.encrypted-dir=${STORAGE_DIR:storage/encrypted}

# Cryptography Settings
# 256-bit Master Key in Hex format (32 bytes = 64 hex characters) used to protect per-file AES-256 keys
app.crypto.master-key=${ENCRYPTION_MASTER_KEY:6d795365637572654d61737465724b657946696c6553746f7261676532303236}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:4a6f75726e6579546f536563757269747946696c6553746f7261676541455332353647434d5365637265744b6579}
app.jwt.expiration-ms=86400000

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging Configuration
logging.level.com.example.securestorage=INFO
