spring.application.name=secure-file-storage

# Server Port - Binds to platform PORT env var (Render, Railway, Heroku, Cloud Run)
server.port=${PORT:8080}

# Cloud / MySQL DataSource with Environment Variable Overrides
# If DB_URL is supplied (e.g. cloud MySQL on Aiven, Clever Cloud, Railway, PlanetScale, TiDB), it connects to it.
# Otherwise, defaults to persistent local DB with MySQL compatibility mode for instant zero-config startup!
spring.datasource.url=${DB_URL:jdbc:h2:file:./storage/appdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Storage Configuration (Local simulated cloud storage directory)
app.storage.encrypted-dir=${STORAGE_DIR:storage/encrypted}

# Cryptography Settings
# 256-bit Master Key in Hex format (32 bytes = 64 hex characters) used to protect per-file AES-256 keys
app.crypto.master-key=${ENCRYPTION_MASTER_KEY:6d795365637572654d61737465724b657946696c6553746f7261676532303236}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:4a6f75726e6579546f536563757269747946696c6553746f7261676541455332353647434d5365637265744b6579}
app.jwt.expiration-ms=86400000

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging Configuration
logging.level.com.example.securestorage=INFO
