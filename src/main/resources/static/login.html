<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Secure File Storage System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .login-card {
            max-width: 480px;
            margin: 4rem auto;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .login-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 2rem;
            color: #ffffff;
            text-align: center;
            border-bottom: 3px solid #38bdf8;
        }
        .demo-btn {
            font-size: 0.8rem;
            padding: 4px 10px;
            margin: 2px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="login-card bg-white">
            <div class="login-header">
                <div class="mb-2">
                    <i class="fas fa-shield-halved fa-3x" style="color: #38bdf8;"></i>
                </div>
                <h4 class="fw-bold mb-1">Secure File Storage</h4>
                <p class="text-secondary small mb-0">AES-256 Encryption &bull; Role-Based Access Control</p>
            </div>

            <div class="p-4">
                <div id="alert-container"></div>

                <!-- Quick Demo Login Buttons -->
                <div class="p-3 bg-light rounded-3 mb-4 border">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <small class="fw-bold text-uppercase text-muted" style="font-size: 0.72rem;">
                            <i class="fas fa-key me-1"></i> Demo Credentials (Click to fill)
                        </small>
                        <span class="badge bg-secondary">Demo Viva Mode</span>
                    </div>
                    <div class="d-flex flex-wrap gap-1">
                        <button type="button" class="btn btn-outline-danger demo-btn" onclick="fillDemo('admin', 'admin123')">
                            <i class="fas fa-crown me-1"></i> admin
                        </button>
                        <button type="button" class="btn btn-outline-warning text-dark demo-btn" onclick="fillDemo('manager', 'manager123')">
                            <i class="fas fa-briefcase me-1"></i> manager
                        </button>
                        <button type="button" class="btn btn-outline-primary demo-btn" onclick="fillDemo('employee', 'employee123')">
                            <i class="fas fa-user me-1"></i> employee
                        </button>
                        <button type="button" class="btn btn-outline-purple text-dark demo-btn" style="border-color: #8b5cf6;" onclick="fillDemo('auditor', 'auditor123')">
                            <i class="fas fa-clipboard-check me-1"></i> auditor
                        </button>
                    </div>
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold small">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-user text-secondary"></i></span>
                            <input type="text" class="form-control" id="username" required placeholder="Enter username" autocomplete="username">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-lock text-secondary"></i></span>
                            <input type="password" class="form-control" id="password" required placeholder="Enter password" autocomplete="current-password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="submitBtn">
                        <i class="fas fa-sign-in-alt me-2"></i> Authenticate &amp; Access System
                    </button>
                </form>
            </div>

            <div class="p-3 bg-light border-top text-center">
                <small class="text-muted">
                    <i class="fas fa-info-circle me-1"></i> B.Tech Final Project Prototype: Secure File Storage
                </small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        function fillDemo(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showAlert('Please enter both username and password.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const resData = await response.json();

                if (response.ok && resData.success) {
                    setAuth(resData.data.token, resData.data);
                    showAlert('Authentication successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/admin-dashboard.html';
                    }, 500);
                } else {
                    showAlert(resData.message || 'Authentication failed. Please check credentials.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Authenticate &amp; Access System';
                }
            } catch (err) {
                showAlert('Connection error: ' + err.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Authenticate &amp; Access System';
            }
        });
    </script>
</body>
</html>
